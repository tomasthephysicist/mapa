name: Zkusebni mapa

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  stavba:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalace nastroju
        run: |
          sh ./setup.sh
          npx playwright install-deps chromium

      - name: Zalozeni mapy (1 ctverec)
        run: |
          .venv/bin/python novy_mesto.py "Záchlumí" --dotaz "Záchlumí, okres Ústí nad Orlicí, Česko"
          cat mesto.json

      - name: Stavba mapy
        run: sh ./postav.sh

      - name: Velikost a adresy
        run: |
          du -sh site
          find site -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  zverejneni:
    needs: stavba
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - id: nasazeni
        uses: actions/deploy-pages@v4
